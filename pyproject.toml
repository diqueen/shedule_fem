[project]
name = "gtifem-schedule-bot"
version = "1.0.0"
description = "Telegram-бот с расписанием СПбГТИ(ТУ) / ФЭМ (gtifem.ru)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NLP-Core-Team" }]

dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "APScheduler>=3.10,<4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "freezegun>=1.5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
