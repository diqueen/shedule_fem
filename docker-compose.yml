services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schedule_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedule_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # PostgreSQL нужен только боту внутри docker-сети (по имени postgres:5432).
    # Порт публикуем лишь на localhost — чтобы не выставлять БД в интернет на VPS.
    # Если доступ к БД снаружи не нужен вообще, строку ports можно удалить.
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./debug:/app/debug

volumes:
  pgdata:
